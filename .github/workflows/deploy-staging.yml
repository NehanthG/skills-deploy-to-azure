name: Deploy to Staging
on:
  pull_request:
    types: [labeled]

jobs:
  deploy-staging:
    if: contains(github.event.pull_request.labels.*.name, 'stage')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::934930267028:role/GitHubActionsDeployRole
          aws-region: us-east-1

      - name: Deploy to S3 staging bucket
        run: |
          aws s3 sync . s3://tictactoe-staging-nehanth --exclude ".git/*" --delete

      - name: Print staging URL
        run: echo "Staging → http://tictactoe-staging-nehanth.s3-website-us-east-1.amazonaws.com"
